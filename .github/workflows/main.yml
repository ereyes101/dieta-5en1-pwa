# service worker
sw_js = textwrap.dedent("""
  const CACHE = 'dieta5en1-v1';
  const OFFLINE_URLS = [
    '/dieta-5en1-pwa/',
    '/dieta-5en1-pwa/index.html',
  ];

  self.addEventListener('install', (event) => {
    event.waitUntil(caches.open(CACHE).then((cache)=> cache.addAll(OFFLINE_URLS)));
    self.skipWaiting();
  });

  self.addEventListener('activate', (event) => {
    event.waitUntil(self.clients.claim());
  });

  self.addEventListener('fetch', (event) => {
    const url = new URL(event.request.url);
    if (url.origin === location.origin) {
      event.respondWith(
        caches.match(event.request).then((cached) => cached || fetch(event.request).then((resp) => {
          const copy = resp.clone();
          caches.open(CACHE).then((cache)=> cache.put(event.request, copy));
          return resp;
        }).catch(()=> caches.match('/dieta-5en1-pwa/index.html')))
      );
    }
  });
""")
with open(os.path.join(project_dir, "service-worker.js"), "w") as f:
    f.write(sw_js)

