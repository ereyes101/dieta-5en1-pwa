# README.md with instructions
readme = textwrap.dedent("""
  # Dieta 5-en-1 — PWA (React + Vite + Tailwind)

  PWA minimalista estilo "Steve Jobs" para bajar de peso con la dieta 5-en-1.

  ## Desarrollo local
  ```bash
  npm install
  npm run dev
