def make_icon(size, name):
    img = Image.new("RGBA", (size, size), (255,255,255,0))
    draw = ImageDraw.Draw(img)
    # simple black rounded square with leaf glyph-like
    draw.rounded_rectangle([0,0,size-1,size-1], radius=int(size*0.2), fill=(0,0,0,255))
    img.save(os.path.join(icons_dir, name))
